<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dear Sunday: quả chuối mặt cười giữa lá cây">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#a6e3e1"/><stop offset=".6" stop-color="#79c3c4"/><stop offset="1" stop-color="#4fa3a7"/>
    </radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="4.5" fill="#ffffff" opacity=".22"/><circle cx="36" cy="36" r="4.5" fill="#ffffff" opacity=".22"/>
    </pattern>
    <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2c8f4e"/><stop offset=".5" stop-color="#5cc56a"/><stop offset="1" stop-color="#3aa65a"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f7a43"/><stop offset=".5" stop-color="#46b05e"/><stop offset="1" stop-color="#2d9150"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffe98a"/><stop offset=".35" stop-color="#ffd24a"/><stop offset=".75" stop-color="#f2a91f"/><stop offset="1" stop-color="#cf8412"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b9824a"/><stop offset=".5" stop-color="#8a5a2c"/><stop offset="1" stop-color="#5b3a1a"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#b08a4a"/><stop offset=".6" stop-color="#7d5a28"/><stop offset="1" stop-color="#523716"/>
    </linearGradient>
    <radialGradient id="gloss" cx="35%" cy="25%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="lf" d="M0 0C46-40 58-150 0-250C-58-150-46-40 0 0Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#dots)"/>

    <!-- lá cây xung quanh -->
    <g stroke="#176338" stroke-width="5" stroke-linejoin="round">
      <g transform="translate(256 452) rotate(-74) scale(1.05)"><use href="#lf" fill="url(#leaf2)"/></g>
      <g transform="translate(256 452) rotate(74) scale(1.05)"><use href="#lf" fill="url(#leaf2)"/></g>
      <g transform="translate(256 452) rotate(-42) scale(1.12)"><use href="#lf" fill="url(#leaf)"/></g>
      <g transform="translate(256 452) rotate(42) scale(1.12)"><use href="#lf" fill="url(#leaf)"/></g>
    </g>
    <g stroke="#e4f9d4" stroke-width="3.5" stroke-linecap="round" opacity=".7" fill="none">
      <g transform="translate(256 452) rotate(-42) scale(1.12)"><path d="M0 -8V-236"/></g>
      <g transform="translate(256 452) rotate(42) scale(1.12)"><path d="M0 -8V-236"/></g>
      <g transform="translate(256 452) rotate(-74) scale(1.05)"><path d="M0 -8V-236"/></g>
      <g transform="translate(256 452) rotate(74) scale(1.05)"><path d="M0 -8V-236"/></g>
    </g>

    <!-- bóng dưới chân -->
    <ellipse cx="280" cy="438" rx="92" ry="16" fill="#0b3b3d" opacity=".35" filter="url(#blur6)"/>

    <!-- chân nâu -->
    <g transform="translate(18 0)"><g stroke="#3e2710" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M222 372c-2 22-2 40 0 50c-14 2-24 8-22 14c3 8 38 8 46 0c4-4 0-10-4-14c-2-10-2-28 0-50z" fill="url(#leg)"/>
      <path d="M282 372c-2 22-2 40 0 50c-14 2-24 8-22 14c3 8 38 8 46 0c4-4 0-10-4-14c-2-10-2-28 0-50z" fill="url(#leg)"/>
    </g>
    <ellipse cx="226" cy="426" rx="5" ry="9" fill="#fff" opacity=".28"/>
    <ellipse cx="286" cy="426" rx="5" ry="9" fill="#fff" opacity=".28"/></g>

    <!-- cuống chuối -->
    <g stroke="#3e2710" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M244 140L236 92c-1-9 5-14 15-14s17 5 17 14l12 48z" fill="url(#stem)"/>
    </g>
    <ellipse cx="251" cy="82" rx="14" ry="6" fill="#3e2710"/>

    <!-- thân chuối -->
    <path d="M236 132C214 190 196 250 214 310C226 350 250 372 282 366C322 358 342 318 334 262C326 206 296 160 272 132C262 122 242 122 236 132Z" fill="url(#peel)" stroke="#9a5f0c" stroke-width="7" stroke-linejoin="round"/>
    <path d="M304 172C322 222 316 290 292 338" fill="none" stroke="#c07a12" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <path d="M250 150C226 206 218 270 234 326" fill="none" stroke="#fff3b3" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <ellipse cx="236" cy="200" rx="22" ry="58" fill="url(#gloss)" transform="rotate(10 236 200)"/>

    <!-- mặt -->
    <g transform="translate(10 4)">
      <ellipse cx="236" cy="252" rx="13" ry="18" fill="#3b2410"/>
      <ellipse cx="288" cy="256" rx="13" ry="18" fill="#3b2410"/>
      <ellipse cx="240" cy="245" rx="5" ry="6" fill="#fff"/><ellipse cx="292" cy="249" rx="5" ry="6" fill="#fff"/>
      <circle cx="233" cy="258" r="2.6" fill="#fff" opacity=".8"/><circle cx="285" cy="262" r="2.6" fill="#fff" opacity=".8"/>
      <ellipse cx="214" cy="288" rx="14" ry="9" fill="#ff7e6b" opacity=".7" filter="url(#blur3)"/>
      <ellipse cx="306" cy="294" rx="13" ry="9" fill="#ff7e6b" opacity=".7" filter="url(#blur3)"/>
      <path d="M244 282c8 20 34 22 46 2" fill="#7a2a1e" stroke="#3b2410" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M254 296c6 6 20 6 28-2c-6-6-24-6-28 2z" fill="#ff8f86"/>
    </g>
  </g>
  <rect x="5" y="5" width="502" height="502" rx="108" fill="none" stroke="#2f6f72" stroke-width="10"/>
</svg>
