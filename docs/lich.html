<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Lịch phòng Dear Sunday</title>
<meta name="theme-color" content="#102617">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Itim&display=swap">
<style>
/* Trang chỉ xem: lịch tháng, chỉ hiện ngày trống hoặc bận. Cùng phong cách "Sun" với ứng dụng. */
:root{--teal:#79c3c4;--cream:#fff7e8;--brown:#4a3a2c;--free:#e4f5d9;--part:#ffe9a8;--full:#f59a8e;--mustard:#f2c14e;
  --f-head:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-body:"Itim","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--brown);font:18px/1.45 var(--f-body);
  background:var(--teal) radial-gradient(circle,rgba(255,255,255,.28) 3px,transparent 3.5px) 0 0/28px 28px;
  padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin-inline:auto;display:grid;gap:16px;min-width:0}
.head{display:flex;align-items:center;gap:12px}
.head img{width:60px;height:60px;border-radius:16px;border:3px solid var(--brown);box-shadow:3px 3px 0 var(--brown);background:#102617}
h1{margin:0;font:800 28px/1.1 var(--f-head);text-wrap:balance}
.sub{margin:2px 0 0;font-size:16px}
.card{background:var(--cream);border:4px solid var(--brown);border-radius:22px;box-shadow:6px 6px 0 var(--brown);padding:16px;display:grid;gap:12px;min-width:0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{font:700 20px var(--f-head);color:var(--brown);background:var(--cream);border:3px solid var(--brown);border-radius:16px;min-width:48px;min-height:48px;cursor:pointer;touch-action:manipulation}
.nav button:active{transform:translate(2px,2px)}
.nav .t{font:800 22px var(--f-head);text-align:center;flex:1}
.nav .today{font-size:16px;padding:0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:18px;border-radius:6px;border:2px solid var(--brown);display:inline-block}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font:700 15px var(--f-head)}
.day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid var(--brown);border-radius:12px;font:700 18px var(--f-head);min-width:0}
.day small{font:500 11px var(--f-body);line-height:1}
.f{background:var(--free)}.p{background:var(--part)}.k{background:var(--full)}
.past{opacity:.45;filter:grayscale(.5)}
.out{visibility:hidden}
.now{outline:4px solid var(--brown);outline-offset:2px}
.foot{font-size:15px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px}
.err{background:#ffd9d2;border:3px solid var(--brown);border-radius:14px;padding:10px 12px;font-size:16px}
.err button{font:700 16px var(--f-head);margin-left:8px;border:3px solid var(--brown);border-radius:12px;background:var(--cream);color:var(--brown);min-height:40px;padding:0 12px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
@media (max-width:380px){.day{font-size:16px}.day small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <img src="icons/icon-192.png" alt="" width="60" height="60">
    <div><h1>Lịch phòng Dear Sunday</h1><p class="sub">Chỉ để xem, tự cập nhật theo ứng dụng.</p></div>
  </div>
  <div class="card">
    <div class="nav">
      <button id="prev" aria-label="Tháng trước">&lsaquo;</button>
      <div class="t" id="title" aria-live="polite"></div>
      <button id="next" aria-label="Tháng sau">&rsaquo;</button>
    </div>
    <div class="legend">
      <span><i class="f"></i>Trống</span>
      <span><i class="p"></i>Chỉ bận theo giờ, đêm vẫn trống</span>
      <span><i class="k"></i>Kín đêm</span>
    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="days"></div>
    <div id="err" class="err" hidden></div>
    <div class="foot"><span id="upd">Đang tải lịch...</span><button class="nav today" id="todayBtn" style="all:unset;cursor:pointer;text-decoration:underline;font-weight:700">Về tháng này</button></div>
  </div>
</div>
<script>
var API='https://script.google.com/macros/s/AKfycbw-eAIdCCp4bF2ndDLhYWxho9tlHa7PH7Kd1PmYNeZggs8ikzlqWXSP0p2Kt2Ep_HtMYw/exec?cal=1';
var DATA={night:{},day:{}}, loaded=false, REFRESH=60000;
var cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),1);
var $=function(s){return document.querySelector(s)};
function pad(n){return n<10?'0'+n:''+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayKey(){var t=new Date();return key(t.getFullYear(),t.getMonth(),t.getDate())}
function render(){
  var y=cur.getFullYear(),m=cur.getMonth();
  $('#title').textContent='Tháng '+(m+1)+'/'+y;
  $('#dows').innerHTML=['T2','T3','T4','T5','T6','T7','CN'].map(function(x){return '<div class="dow">'+x+'</div>'}).join('');
  var first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=todayKey(),h='';
  for(var i=0;i<first;i++)h+='<div class="day out"></div>';
  for(var d=1;d<=n;d++){
    var k=key(y,m,d),cls='f',txt='Trống';
    if(DATA.night[k]){cls='k';txt='Kín'}else if(DATA.day[k]){cls='p';txt='Theo giờ'}
    if(!loaded){cls='f';txt=''}
    h+='<div class="day '+cls+(k<t?' past':'')+(k===t?' now':'')+'" role="img" aria-label="Ngày '+d+': '+(loaded?(cls==='k'?'kín đêm':cls==='p'?'chỉ bận theo giờ':'trống'):'đang tải')+'">'+d+'<small>'+txt+'</small></div>';
  }
  $('#days').innerHTML=h;
}
function setErr(msg){var e=$('#err');e.hidden=!msg;e.innerHTML=msg?esc(msg)+' <button id="retry" type="button">Thử lại</button>':'';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function load(){
  return fetch(API,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j||!j.ok||!Array.isArray(j.night))throw new Error('bad');
    var nn={},dd={};j.night.forEach(function(d){nn[d]=1});j.day.forEach(function(d){dd[d]=1});
    DATA={night:nn,day:dd};loaded=true;setErr('');
    var u=new Date();$('#upd').textContent='Cập nhật lúc '+pad(u.getHours())+':'+pad(u.getMinutes());
    render();
  }).catch(function(){
    setErr(loaded?'Chưa cập nhật được, đang hiện dữ liệu lần trước.':'Không tải được lịch. Kiểm tra mạng rồi thử lại.');
    if(!loaded)$('#upd').textContent='';
  });
}
$('#prev').addEventListener('click',function(){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()});
$('#next').addEventListener('click',function(){cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()});
$('#todayBtn').addEventListener('click',function(){var t=new Date();cur=new Date(t.getFullYear(),t.getMonth(),1);render()});
document.addEventListener('click',function(e){if(e.target&&e.target.id==='retry')load()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')load()});
setInterval(function(){if(document.visibilityState!=='hidden')load()},REFRESH);
render();load();
</script>
</body>
</html>
